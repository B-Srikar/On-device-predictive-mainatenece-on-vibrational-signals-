

# CWRU 0 HP DE recordings requested for this project (12 kHz series).
sampling_rate: 12000
window_size: 1024
overlap: 0.5
# Set to blank to retain the matched sampling rate. Stage 2 evaluates 3200 Hz.
target_rate: 3200
ema_alpha: 0.1

# Sampling rates are explicit because CWRU MAT files do not encode them.
# Update a value only after checking the source recording's CWRU metadata.
source_sampling_rates:
  normal_0.mat: 48000   # Normal Baseline page: 48 kHz. Confirmed by shaft-freq check (29.91 Hz @ 48k assumption, error 0.02 Hz; 40.44 Hz @ 12k assumption, error 10.50 Hz).
  normal_1.mat: 48000   # 1 HP (file 98). Confirmed 48 kHz: shaft peak 29.56 Hz, error 0.03 Hz vs expected 29.53 Hz.
  normal_2.mat: 48000   # 2 HP (file 99, var X099_DE_time). Confirmed 48 kHz: shaft peak 29.19 Hz, error 0.03 Hz vs expected 29.17 Hz.
  normal_3.mat: 48000   # 3 HP (file 100). Confirmed 48 kHz: shaft peak 28.76 Hz, error 0.07 Hz vs expected 28.83 Hz.
  IR007_0.mat: 12000
  B007_0.mat: 12000
  OR007@6_0.mat: 12000
  IR014_0.mat: 12000
  B014_0.mat: 12000
  OR014@6_0.mat: 12000
  IR021_0.mat: 12000
  B021_0.mat: 12000
  OR021@6_0.mat: 12000

# Hz, evaluated after optional resampling. Bands span 0 to the 3200 Hz Nyquist.
fft_bands_hz: [[0, 400], [400, 800], [800, 1200], [1200, 1600]]
# Extra high-frequency bands for 12 kHz path only (Nyquist = 6000 Hz).
fft_bands_hz_12k: [[0, 400], [400, 800], [800, 1200], [1200, 1600], [1600, 3000], [3000, 6000]]

# Stage-3 HI settings.
hi_compression: log1p   # Stage 3c: log1p(z) replaces hard hi_z_cap compression
hi_z_cap: 6         # z-scores clipped to [-6, 6] before squaring (single outlier guard)
hi_threshold_k: 3   # threshold = mean(holdout_HI) + k * std(holdout_HI)
hi_sigma_floor: 0.0001  # Stage 3b: minimum per-feature sigma used in z = (x-mu)/max(sigma, floor)

# Health-index evaluation settings.
evaluation_rates: [12000, 3200]
baseline_fraction: 0.7
hi_method: zscore_mean
mahalanobis_regularization: 0.000001
hi_threshold_quantile: 0.95

# Baseline-detector settings. These are evaluation baselines, not the ESP32 HI.
fixed_threshold_z: 3.0
iforest_trees: 100
iforest_subsample: 256
iforest_seed: 42
iforest_threshold_quantile: 0.95

# IMS run-to-failure settings (Stage 5 — locked before running).
# Per Readme Document for IMS Bearing Data.pdf (Set No. 2, 984 files, 4 ch):
#   Ch 1 (index 0) = Bearing 1 (outer race failure at end of test)
#   Ch 2-4 (indices 1-3) = Bearings 2-4 (did not fail); Ch 4 (index 3) is farthest control.
ims_snapshot_directory: data/raw/ims/2nd_test
ims_channel: 0
ims_control_channel: 3
ims_sampling_rate: 20480
ims_window_size: 1024
ims_overlap: 0.5
# 5 contiguous bands spanning 0 to Nyquist (10240 Hz):
#   0-500: shaft (~33.3 Hz) & bearing fault fundamentals; 500-1500: low-mid harmonics;
#   1500-3000: mid resonance; 3000-6000: primary bearing resonance; 6000-10240: high-freq impact.
ims_fft_bands_hz: [[0, 500], [500, 1500], [1500, 3000], [3000, 6000], [6000, 10240]]
ims_baseline_fraction: 0.10
ims_calibration_fraction: 0.10
ims_ema_alpha: 0.1
ims_threshold_k: 3.0
ims_slope_window: 12
ims_slope_threshold_sigma: 3.0
ims_consecutive_alarms: 3
ims_sensitivity_alphas: [0.05, 0.1, 0.2]
ims_sensitivity_baseline_fractions: [0.05, 0.10, 0.15]

# Stage 4 baseline settings (pre-specified before running).
ims_exclude_snapshots: [982, 983]        # shaft-stopped snapshots excluded from all Stage 4 IMS analysis
ims_machine_off_rms_ratio: 0.10          # skip update if snapshot RMS < 10% of baseline median RMS
ims_presumed_healthy_range: [196, 491]   # assumed healthy window for false-alarm counts (informed by Stage 5 plots)
stage4_iforest_n_estimators: 100
stage4_iforest_max_samples: 256
stage4_iforest_random_state: 0

# Stage 8 sensor resolution and noise sweep (simulated, not measured sensor).
stage8_seed: 0
stage8_num_seeds: 10
stage8_cwru_lsb_mg: [0.0, 3.9, 7.8, 15.6, 31.2]     # 0.0 = unquantized reference; applied on 3200 Hz stream (mg)
stage8_cwru_noise_mg: [0.0, 5.0, 10.0]              # white Gaussian noise RMS in mg (added before quantization)
stage8_ims_lsb_divisors: [0, 16, 8, 4, 2]           # 0 = unquantized reference; else LSB = baseline_rms / d
stage8_ims_noise_ratios: [0.0, 0.125, 0.25]         # noise RMS / baseline_rms (matches CWRU 0/5/10 mg vs ~40 mg RMS)
